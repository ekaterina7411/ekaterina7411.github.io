<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Automation Dashboard | Екатерина</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: #333; margin-bottom: 30px; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .stat-card h3 { color: #666; font-size: 14px; text-transform: uppercase; margin-bottom: 10px; }
        .stat-card .value { font-size: 42px; font-weight: bold; color: #2196F3; }
        .stat-card.success .value { color: #4CAF50; }
        .stat-card.warning .value { color: #FF9800; }
        .stat-card.error .value { color: #f44336; }
        
        .actions { display: flex; gap: 15px; margin-bottom: 30px; flex-wrap: wrap; }
        button { padding: 15px 30px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: all 0.3s; }
        .btn-primary { background: #2196F3; color: white; }
        .btn-primary:hover { background: #1976D2; transform: translateY(-2px); }
        .btn-secondary { background: #9E9E9E; color: white; }
        .btn-secondary:hover { background: #757575; transform: translateY(-2px); }
        
        .logs { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .logs h2 { margin-bottom: 20px; color: #333; }
        .log-entry { padding: 12px; border-bottom: 1px solid #eee; font-family: 'Courier New', monospace; font-size: 13px; display: flex; gap: 10px; }
        .log-entry:last-child { border-bottom: none; }
        .log-time { color: #888; min-width: 70px; }
        .log-info { color: #2196F3; }
        .log-success { color: #4CAF50; }
        .log-warning { color: #FF9800; }
        .log-error { color: #f44336; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 HR Automation Dashboard</h1>
        
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Всего обработано</h3>
                <div class="value" id="totalProcessed">0</div>
            </div>
            <div class="stat-card success">
                <h3>Лидов создано</h3>
                <div class="value" id="leadsCreated">0</div>
            </div>
            <div class="stat-card warning">
                <h3>Дубликатов найдено</h3>
                <div class="value" id="duplicatesFound">0</div>
            </div>
            <div class="stat-card error">
                <h3>Ошибок</h3>
                <div class="value" id="errors">0</div>
            </div>
        </div>
        
        <div class="actions">
            <button class="btn-primary" onclick="testLead()">🧪 Тестовый отклик</button>
            <button class="btn-secondary" onclick="refreshStats()">🔄 Обновить статистику</button>
        </div>
        
        <div class="logs">
            <h2>📋 Логи работы</h2>
            <div id="logEntries"></div>
        </div>
    </div>
    
    <script>
        // Демо-данные для портфолио (имитация работы бэкенда)
        let stats = { total_processed: 142, leads_created: 128, duplicates_found: 12, errors: 2 };
        
        let logs = [
            { time: '10:45:12', type: 'info', msg: 'Получен новый отклик с HH.ru (ID: 982341)' },
            { time: '10:45:13', type: 'info', msg: 'Хэш контакта: a1b2c3d4... Проверка на дубликат: нет' },
            { time: '10:45:14', type: 'success', msg: '✅ Лид успешно создан в Битрикс24 (ID: 4512)' },
            { time: '10:46:01', type: 'warning', msg: '⚠️ Получен отклик с существующим контактом. Дубликат пропущен.' },
            { time: '10:47:22', type: 'info', msg: 'Получен новый отклик с HH.ru (ID: 982355)' },
            { time: '10:47:23', type: 'success', msg: '✅ Лид успешно создан в Битрикс24 (ID: 4513)' }
        ];

        function renderStats() {
            document.getElementById('totalProcessed').textContent = stats.total_processed;
            document.getElementById('leadsCreated').textContent = stats.leads_created;
            document.getElementById('duplicatesFound').textContent = stats.duplicates_found;
            document.getElementById('errors').textContent = stats.errors;
        }

        function renderLogs() {
            const container = document.getElementById('logEntries');
            container.innerHTML = '';
            logs.forEach(log => {
                const div = document.createElement('div');
                div.className = `log-entry log-${log.type}`;
                div.innerHTML = `<span class="log-time">[${log.time}]</span> <span>${log.msg}</span>`;
                container.appendChild(div);
            });
        }

        function testLead() {
            stats.total_processed++;
            stats.leads_created++;
            const now = new Date().toLocaleTimeString('ru-RU');
            logs.unshift({ time: now, type: 'success', msg: '🧪 Тестовый отклик успешно обработан и отправлен в Битрикс24' });
            renderStats();
            renderLogs();
        }

        function refreshStats() {
            renderStats();
            renderLogs();
            const btn = document.querySelector('.btn-secondary');
            const originalText = btn.textContent;
            btn.textContent = '⏳ Обновление...';
            setTimeout(() => {
                btn.textContent = originalText;
            }, 600);
        }

        renderStats();
        renderLogs();
    </script>
</body>
</html>
